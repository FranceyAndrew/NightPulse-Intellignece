# Example credentials file for NightPulse Intelligence
# Copy this file to credentials.yaml and fill in your actual keys locally. 

weather_api:
  provider: "OpenWeatherMap"
  api_key: "YOUR_OPENWEATHERMAP_API_KEY"

sports_api:
  provider: "SportsDataIO"
  api_key: "YOUR_SPORTSDATAIO_API_KEY"

university_calendar:
  provider: "UniversityCalendarAPI"
  api_key: "YOUR_UNIVERSITYCALENDARAPI_KEY"

database:
  host: "localhost"
  port: 5432
  username: "YOUR_DATABASE_USERNAME"
  password: "YOUR_DATABASE_PASSWORD" 
  databse: "nightpulse_db"
