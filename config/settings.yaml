project:
  name: "NightPulse Intelligence"
  version: "0.1.0"
  environment: "development"  # development | staging | production
  
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  external_data: "data/external"
  features: "data/features"

forecast:
  horizon_days: 7
  include_weather: true
  include_sports: true
  include_university_calendar: true
  include_competitor_data: true
  include_social_media: true
  include_google_trends: true
  include_staffing_data: true

model:
  default_model: "xgboost"
  prophet:
    seasonality_mode: "multiplicative"
    changepoint_prior_scale: 0.05
  xgboost:
    n_estimators: 300
    learning_rate: 0.1
    max_depth: 6
  lstm:
    sequence_length: 30
    hidden_units: 64 
    dropout: 0.2

dashboard:
  theme: "dark"
  refresh_interval: 60  # in seconds

location:
  city: "Waterloo"
  country: "CA"
  name: "Revive Karaoke Bar"
  location_url: f"https://nominatim.openstreetmap.org/search"

  weekly_hours:
    monday:
      open: null
      close: null
      events: []
    tuesday:
      open: "20:00"
      close: "02:00"
      events: 
        - name: open_mic
          start: "20:00"
          end: "22:00"
    wednesday:
      open: "22:00"
      close: "02:00"
      events: []
    thursday:
      open: "22:00"
      close: "02:00"
      events: []
    friday:
      open: "21:00"
      close: "02:00"
      events: []
    saturday:
      open: "21:00" 
      close: "02:00"
      events: []
    sunday:
      open: null
      close: null
      events: []
  
  promotions:
      

weather_api:
  provider: "OpenWeather"
  base_url: "https://api.openweathermap.org/data/2.5/onecall"
  units: "metric"  # metric | imperial




